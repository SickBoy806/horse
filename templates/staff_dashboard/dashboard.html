{% extends "staff_dashboard/base_staff.html" %}

{% block content %}
<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
  <div class="p-6 bg-gradient-to-br from-blue-50 to-blue-100 rounded-xl card-hover">
    <div class="text-3xl mb-3">📋</div>
    <h3 class="font-semibold content-heading">Branch</h3>
    <p class="content-text text-lg font-bold text-blue-700 mt-1">{{ branch }}</p>
  </div>
  <div class="p-6 bg-gradient-to-br from-green-50 to-green-100 rounded-xl card-hover">
    <div class="text-3xl mb-3">🐾</div>
    <h3 class="font-semibold content-heading">Animals</h3>
    <p class="content-text text-sm mt-2">View and monitor animals in your branch</p>
  </div>
  <div class="p-6 bg-gradient-to-br from-amber-50 to-amber-100 rounded-xl card-hover">
    <div class="text-3xl mb-3">💬</div>
    <h3 class="font-semibold content-heading">Messages</h3>
    <p class="content-text text-sm mt-2">Check your inbox for updates</p>
  </div>
</div>
{% endblock %}
