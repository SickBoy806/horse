{% extends "veterinarian_dashboard/base_dashboard.html" %}
{% block page_title %}Search Medical Records — TPF Animal System{% endblock %}

{% block content %}
<div class="glassmorphism rounded-2xl p-6 mb-6">
  <div class="flex items-center justify-between flex-wrap gap-4">
    <div>
      <h2 class="content-heading text-2xl">Search Medical Records</h2>
      <p class="content-text text-sm mt-1">Search your records by diagnosis</p>
    </div>
    <form method="get" class="tpf-form flex gap-2 w-full sm:w-auto">
      <input type="text" name="q" value="{{ query }}" placeholder="e.g. parvovirus" style="min-width:16rem">
      <button type="submit" class="btn-tpf">Search</button>
    </form>
  </div>
</div>
{% include "veterinarian_dashboard/_medical_records_table.html" %}
{% endblock %}
