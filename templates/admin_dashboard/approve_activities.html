{% extends "admin_dashboard/base_admin.html" %}
{% block page_title %}Approve Activities — TPF Animal System{% endblock %}

{% block content %}

<div class="glassmorphism rounded-2xl p-6 mb-6">
  <h2 class="content-heading text-2xl">Approve Activities</h2>
  <p class="content-text text-sm mt-1">Branch: {{ branch|title }}</p>
</div>

<div class="glassmorphism rounded-2xl p-8 text-center">
  <div class="w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4"
       style="background: linear-gradient(135deg, #f0fdf4, #dcfce7);">
    <svg class="w-7 h-7 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
  </div>
  <p class="content-heading font-semibold">Activity approval coming soon</p>
  <p class="content-text text-sm mt-1">Pending activities for approval will appear here.</p>
</div>

{% endblock %}
