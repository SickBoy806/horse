{% extends base_template %}
{% block page_title %}Assign Task — TPF Animal System{% endblock %}

{% block content %}
<div class="glassmorphism rounded-2xl p-6 mb-6">
  <h2 class="content-heading text-2xl">Assign Task</h2>
  <p class="content-text text-sm mt-1">Create a task and assign it to a team member</p>
</div>

<div class="glassmorphism rounded-2xl overflow-hidden">
  <div class="tpf-panel-head">Task Details</div>
  <form method="post" class="tpf-form p-6 space-y-5" novalidate>
    {% csrf_token %}
    {% include "partials/form_fields.html" with form=form %}
    <div class="pt-4 border-t border-slate-100 flex justify-end">
      <button type="submit" class="btn-tpf btn-tpf-success">Assign Task</button>
    </div>
  </form>
</div>
{% endblock %}
