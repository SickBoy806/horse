{% if messages %}
<div class="mb-5 space-y-2">
  {% for message in messages %}
  <div class="px-4 py-3 rounded-xl text-sm font-medium {% if message.tags == 'success' %}bg-green-50 border border-green-200 text-green-700{% elif message.tags == 'error' %}bg-red-50 border border-red-200 text-red-700{% else %}bg-blue-50 border border-blue-200 text-blue-700{% endif %}">{{ message }}</div>
  {% endfor %}
</div>
{% endif %}
