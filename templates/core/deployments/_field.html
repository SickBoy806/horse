<div>
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-red-500">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="text-xs text-slate-400 mt-1">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<p class="text-xs text-red-600 mt-1.5">{{ field.errors.0 }}</p>{% endif %}
</div>
