{% load widget_tweaks %}
<div{% if wide %} class="lg:col-span-2"{% endif %}>
  {% if field.widget_type == 'checkbox' %}
  <label class="flex items-center gap-2 text-sm font-semibold text-slate-700 mt-6">{{ field }} {{ field.label }}</label>
  {% else %}
  <label for="{{ field.id_for_label }}" class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
  {{ field|add_class:"form-field" }}
  {% endif %}
  {% if field.help_text %}<p class="text-xs text-slate-400 mt-1">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<p class="text-xs text-red-600 mt-1">{{ field.errors.0 }}</p>{% endif %}
</div>
